[package]
name = "syact"
authors = [ "Samuel Nösslböck <samuel.noesslboeck@gmail.com>" ]
version = "0.16.1"
description = "A library that defines actuators and their interaction with each other, providing powerful utility for them"
edition = "2024"
repository = "https://github.com/SamuelNoesslboeck/syact"
license-file = "LICENSE"
keywords = [ "framework", "robotics" ]

[lib]
name = "syact"
path = "src/lib.rs"

[dependencies]
embedded-hal = "1.0.0"
serde = { version = "1.0.229", default-features = false, features = [ "derive" ], optional = true }

syunit = "0.5.0"

[features]
default = [ "serde" ]
serde = [ "dep:serde", "syunit/serde" ]
__doctest_helper = [ ]

[[test]]
name = "main_tests"
path = "tests/mod.rs"